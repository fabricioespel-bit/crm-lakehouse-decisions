version: 2

models:
  - name: stg_accounts
    description: "Accounts ativas do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: account_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: "Nome da Account. Contém duplicatas propositais (variações de maiúsculas, sufixo 'Ltda', espaço extra) — resolvidas em int_accounts via int_account_id_mapping."
        data_tests:
          - not_null
      - name: industry
        description: "Setor padronizado via seed industry_mapping (ex.: 'Tech' → 'Technology'). Valores fora do mapeamento passam com o valor original e são acusados pelo teste accepted_values."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: industry_raw
        description: "Valor original do picklist Industry no Salesforce, sem padronização (mantido para auditoria)."
      - name: billing_city
        description: "Cidade de cobrança."
      - name: billing_state_code
        description: "UF de cobrança (código ISO)."
      - name: billing_country_code
        description: "País de cobrança (código ISO)."
      - name: phone
        description: "Telefone principal."
      - name: website
        description: "Site da empresa."
      - name: number_of_employees
        description: "Número de funcionários."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_contacts
    description: "Contatos ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: contact_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "ID da Account à qual o contato pertence (FK para stg_accounts). Pode apontar para uma Account duplicada — a reatribuição para a mestre é feita na intermediate via int_account_id_mapping."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: full_name
        description: "Nome completo do contato, calculado pelo Salesforce (FirstName + LastName)."
        data_tests:
          - not_null
      - name: first_name
        description: "Primeiro nome do contato."
      - name: last_name
        description: "Último nome do contato."
      - name: email
        description: "E-mail do contato."
        data_tests:
          - not_null
      - name: phone
        description: "Telefone do contato."
      - name: title
        description: "Cargo do contato."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_leads
    description: "Leads ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: lead_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: last_name
        description: "Sobrenome do lead."
        data_tests:
          - not_null
      - name: company
        description: "Empresa do lead."
        data_tests:
          - not_null
      - name: status
        description: "Status do lead no funil (picklist Status). Inconsistência proposital: 33 Leads estão 'Closed - Converted' sem conversão real no Salesforce (is_converted = false, sem Opportunity) — acusado pelo teste singular assert_lead_status_matches_conversion (severity warn)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Open - Not Contacted', 'Working - Contacted', 'Closed - Converted', 'Closed - Not Converted']
      - name: lead_source
        description: "Origem do lead (picklist LeadSource). Sujeira proposital: ~22% nulo ou genérico ('Other'), acusada pelos testes not_null e accepted_values com severity warn — dado sujo esperado, tratado na atribuição de marketing (2b/2c), não motivo para travar o pipeline."
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['Web', 'Phone Inquiry', 'Partner Referral', 'Employee Referral', 'Trade Show']
              config:
                severity: warn
      - name: industry
        description: "Setor do lead (picklist Industry). Diferente de stg_accounts, já vem limpo da fonte — não passa pelo seed industry_mapping; o accepted_values fica como proteção."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: is_converted
        description: "Indica se o lead passou pela conversão do Salesforce (Lead → Account/Contact/Opportunity). Todos false nos dados sintéticos, mesmo para status 'Closed - Converted'."
        data_tests:
          - not_null
      - name: utm_source
        description: "Origem de tráfego do lead (campo customizado UTM_Source__c, preenchido via campo oculto de formulário). Nulo esperado: só ~65% dos Leads vindos de marketing receberam UTM (perda de rastreamento proposital). Chave do stitching marketing ↔ Lead (2b)."
      - name: utm_medium
        description: "Mídia de tráfego do lead (campo customizado UTM_Medium__c). Nulo esperado, mesma perda de rastreamento de utm_source."
      - name: utm_campaign
        description: "Campanha de tráfego do lead (campo customizado UTM_Campaign__c). Nulo esperado, mesma perda de rastreamento de utm_source."
      - name: converted_date
        description: "Data de conversão do lead"
      - name: converted_account_id
        description: "ID da Account convertida"
      - name: converted_contact_id
        description: "ID do Contato convertido"
      - name: converted_opportunity_id
        description: "ID da Oportunidade convertida"
      - name: created_at
        description: "Data de criação do lead"
      - name: updated_at
        description: "Data de atualização do lead"
  - name: stg_opportunities
    description: "Opportunities ativas do Salesforce (sem registros deletados), com nomes padronizados e amount tipado como numérico de precisão fixa."
    columns:
      - name: opportunity_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "ID da Account da Opportunity (FK para stg_accounts). Pode apontar para uma Account duplicada — a reatribuição para a mestre é feita na intermediate via int_account_id_mapping."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: primary_contact_id
        description: "Contato primário da Opportunity (campo ContactId, preenchido pelo Salesforce a partir do Contact Role marcado como primário). Nulo esperado em ~19,5% (39 de 200): sujeira proposital de Opportunities sem Contact Role."
      - name: owner_id
        description: "ID do usuário dono da Opportunity."
      - name: opportunity_name
        description: "Nome da Opportunity."
      - name: stage_name
        description: "Estágio do funil de vendas (picklist StageName)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Prospecting', 'Qualification', 'Needs Analysis', 'Proposal/Price Quote', 'Negotiation/Review', 'Closed Won', 'Closed Lost']
      - name: amount
        description: "Valor da Opportunity. Vem como FLOAT do RAW e é convertido para number(18, 2) no staging — valor monetário em ponto flutuante acumula erro de arredondamento em somas."
        data_tests:
          - not_null
      - name: probability
        description: "Probabilidade de fechamento (0–100), derivada do estágio pelo Salesforce."
      - name: close_date
        description: "Data de fechamento (real, se fechada; prevista, se aberta). Tipo DATE, sem hora. Sujeira proposital: ~5% das Opportunities fechadas têm close_date anterior a created_at — acusado pelo teste singular assert_opportunities_close_date_after_created (severity warn). Opportunities abertas podem ter close_date no passado (pipeline vencido)."
        data_tests:
          - not_null
      - name: is_closed
        description: "Indica se a Opportunity está fechada (Closed Won ou Closed Lost), derivado do estágio pelo Salesforce."
        data_tests:
          - not_null
      - name: is_won
        description: "Indica se a Opportunity foi ganha (Closed Won), derivado do estágio pelo Salesforce."
        data_tests:
          - not_null
      - name: forecast_category
        description: "Categoria de forecast (campo ForecastCategory), derivada do estágio pelo Salesforce."
      - name: lead_source
        description: "Origem da Opportunity (campo nativo LeadSource). Vazio em todas as Opportunities: o dado de origem não foi propagado do Lead — por isso a atribuição de marketing (2b) parte dos UTMs do Lead, não deste campo."
      - name: campaign_id
        description: "Primary Campaign Source (campo nativo de atribuição do Salesforce). Vazio em todas as Opportunities, pelo mesmo motivo de lead_source."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."

  - name: stg_opportunity_contact_roles
    description: "Contact Roles ativos do Salesforce (sem registros deletados): tabela de junção N:N entre Opportunity e Contact, com o papel do contato na negociação. Sujeira proposital por ausência: 39 das 200 Opportunities não têm nenhum Contact Role — não aparece aqui (não há linha), e sim como primary_contact_id nulo em stg_opportunities."
    columns:
      - name: opportunity_contact_role_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: opportunity_id
        description: "ID da Opportunity (FK para stg_opportunities)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_opportunities')
                field: opportunity_id
      - name: contact_id
        description: "ID do contato (FK para stg_contacts)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
      - name: role
        description: "Papel do contato na Opportunity (picklist Role). Nos dados sintéticos todos são 'Decision Maker'; o accepted_values usa a lista padrão do Salesforce como proteção."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Business User', 'Decision Maker', 'Economic Buyer', 'Economic Decision Maker', 'Evaluator', 'Executive Sponsor', 'Influencer', 'Technical Buyer', 'Other']
      - name: is_primary
        description: "Indica se é o contato primário da Opportunity — é dele que o Salesforce preenche o ContactId (primary_contact_id em stg_opportunities)."
        data_tests:
          - not_null
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."


