version: 2

models:
  - name: stg_accounts
    description: "Accounts ativas do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: account_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: "Nome da Account. Contém duplicatas propositais (variações de maiúsculas, sufixo 'Ltda', espaço extra) — resolvidas em int_accounts via int_account_id_mapping."
        data_tests:
          - not_null
      - name: industry
        description: "Setor padronizado via seed industry_mapping (ex.: 'Tech' → 'Technology'). Valores fora do mapeamento passam com o valor original e são acusados pelo teste accepted_values."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: industry_raw
        description: "Valor original do picklist Industry no Salesforce, sem padronização (mantido para auditoria)."
      - name: billing_city
        description: "Cidade de cobrança."
      - name: billing_state_code
        description: "UF de cobrança (código ISO)."
      - name: billing_country_code
        description: "País de cobrança (código ISO)."
      - name: phone
        description: "Telefone principal."
      - name: website
        description: "Site da empresa."
      - name: number_of_employees
        description: "Número de funcionários."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_contacts
    description: "Contatos ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: contact_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "ID da Account à qual o contato pertence (FK para stg_accounts). Pode apontar para uma Account duplicada — a reatribuição para a mestre é feita na intermediate via int_account_id_mapping."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: full_name
        description: "Nome completo do contato, calculado pelo Salesforce (FirstName + LastName)."
        data_tests:
          - not_null
      - name: first_name
        description: "Primeiro nome do contato."
      - name: last_name
        description: "Último nome do contato."
      - name: email
        description: "E-mail normalizado (lower + trim). Chave do fallback contact_match do int_lead_opportunities (Lead não convertido cujo e-mail é de um Contact numa Opportunity)."
        data_tests:
          - not_null
      - name: email_raw
        description: "E-mail como digitado no Salesforce. Sujeira proposital: parte dos Contacts criados à mão pelo vendedor tem caixa diferente do e-mail do Lead — mantido para auditoria."
      - name: phone
        description: "Telefone do contato."
      - name: title
        description: "Cargo do contato."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_leads
    description: "Leads ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: lead_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: last_name
        description: "Sobrenome do lead."
        data_tests:
          - not_null
      - name: company
        description: "Empresa do lead."
        data_tests:
          - not_null
      - name: status
        description: "Status do lead no funil (picklist Status). Inconsistência proposital: dos 33 Leads 'Closed - Converted', 20 foram convertidos de verdade e 13 seguem sem conversão real (is_converted = false; 8 deles ligados à Opportunity só pelo e-mail do Contact, ver int_lead_opportunities) — acusado pelo teste singular assert_lead_status_matches_conversion (severity warn)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Open - Not Contacted', 'Working - Contacted', 'Closed - Converted', 'Closed - Not Converted']
      - name: lead_source
        description: "Origem do lead (picklist LeadSource). Sujeira proposital: ~22% nulo ou genérico ('Other'), acusada pelos testes not_null e accepted_values com severity warn — dado sujo esperado, tratado na atribuição de marketing (2b/2c), não motivo para travar o pipeline."
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['Web', 'Phone Inquiry', 'Partner Referral', 'Employee Referral', 'Trade Show']
              config:
                severity: warn
      - name: industry
        description: "Setor do lead (picklist Industry). Diferente de stg_accounts, já vem limpo da fonte — não passa pelo seed industry_mapping; o accepted_values fica como proteção."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: is_converted
        description: "Indica se o lead passou pela conversão do Salesforce (Lead → Account/Contact/Opportunity). 20 Leads convertidos, aplicados no RAW pelo scripts/generate_lead_conversions.py (simula o sync pós-conversão, 27/out/2026)."
        data_tests:
          - not_null
      - name: utm_source
        description: "Origem de tráfego do lead (campo customizado UTM_Source__c, preenchido via campo oculto de formulário). Nulo esperado: só ~65% dos Leads vindos de marketing receberam UTM (perda de rastreamento proposital). Chave do stitching marketing ↔ Lead (2b)."
      - name: utm_medium
        description: "Mídia de tráfego do lead (campo customizado UTM_Medium__c). Nulo esperado, mesma perda de rastreamento de utm_source."
      - name: utm_campaign
        description: "Campanha de tráfego do lead (campo customizado UTM_Campaign__c). Nulo esperado, mesma perda de rastreamento de utm_source."
      - name: converted_date
        description: "Data da conversão do Lead. Nulo quando is_converted = false."
      - name: converted_account_id
        description: "Account em que o Lead foi convertido (FK para stg_accounts; pode ser uma Account duplicada)."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: converted_contact_id
        description: "Contact em que o Lead foi convertido (FK para stg_contacts)."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
      - name: converted_opportunity_id
        description: "Opportunity da conversão (FK para stg_opportunities). Elo principal Lead → Opportunity do int_lead_opportunities."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_opportunities')
                field: opportunity_id
      - name: created_at
        description: "Data de criação do lead"
      - name: updated_at
        description: "Data de atualização do lead"
  - name: stg_opportunities
    description: "Opportunities ativas do Salesforce (sem registros deletados), com nomes padronizados e amount tipado como numérico de precisão fixa."
    columns:
      - name: opportunity_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "ID da Account da Opportunity (FK para stg_accounts). Pode apontar para uma Account duplicada — a reatribuição para a mestre é feita na intermediate via int_account_id_mapping."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: primary_contact_id
        description: "Contato primário da Opportunity (campo ContactId, preenchido pelo Salesforce a partir do Contact Role marcado como primário). Nulo esperado em ~19,5% (39 de 200): sujeira proposital de Opportunities sem Contact Role."
      - name: owner_id
        description: "ID do usuário dono da Opportunity."
      - name: opportunity_name
        description: "Nome da Opportunity."
      - name: stage_name
        description: "Estágio do funil de vendas (picklist StageName)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Prospecting', 'Qualification', 'Needs Analysis', 'Proposal/Price Quote', 'Negotiation/Review', 'Closed Won', 'Closed Lost']
      - name: amount
        description: "Valor da Opportunity. Vem como FLOAT do RAW e é convertido para number(18, 2) no staging — valor monetário em ponto flutuante acumula erro de arredondamento em somas."
        data_tests:
          - not_null
      - name: probability
        description: "Probabilidade de fechamento (0–100), derivada do estágio pelo Salesforce."
      - name: close_date
        description: "Data de fechamento (real, se fechada; prevista, se aberta). Tipo DATE, sem hora. Sujeira proposital: ~5% das Opportunities fechadas têm close_date anterior a created_at — acusado pelo teste singular assert_opportunities_close_date_after_created (severity warn). Opportunities abertas podem ter close_date no passado (pipeline vencido)."
        data_tests:
          - not_null
      - name: is_closed
        description: "Indica se a Opportunity está fechada (Closed Won ou Closed Lost), derivado do estágio pelo Salesforce."
        data_tests:
          - not_null
      - name: is_won
        description: "Indica se a Opportunity foi ganha (Closed Won), derivado do estágio pelo Salesforce."
        data_tests:
          - not_null
      - name: forecast_category
        description: "Categoria de forecast (campo ForecastCategory), derivada do estágio pelo Salesforce."
      - name: lead_source
        description: "Origem da Opportunity (campo nativo LeadSource). Vazio em todas as Opportunities: o dado de origem não foi propagado do Lead — por isso a atribuição de marketing (2b) parte dos UTMs do Lead, não deste campo."
      - name: campaign_id
        description: "Primary Campaign Source (campo nativo de atribuição do Salesforce). Vazio em todas as Opportunities, pelo mesmo motivo de lead_source."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."

  - name: stg_opportunity_contact_roles
    description: "Contact Roles ativos do Salesforce (sem registros deletados): tabela de junção N:N entre Opportunity e Contact, com o papel do contato na negociação. Sujeira proposital por ausência: 39 das 200 Opportunities não têm nenhum Contact Role — não aparece aqui (não há linha), e sim como primary_contact_id nulo em stg_opportunities."
    columns:
      - name: opportunity_contact_role_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: opportunity_id
        description: "ID da Opportunity (FK para stg_opportunities)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_opportunities')
                field: opportunity_id
      - name: contact_id
        description: "ID do contato (FK para stg_contacts)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_contacts')
                field: contact_id
      - name: role
        description: "Papel do contato na Opportunity (picklist Role). Nos dados sintéticos todos são 'Decision Maker'; o accepted_values usa a lista padrão do Salesforce como proteção."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Business User', 'Decision Maker', 'Economic Buyer', 'Economic Decision Maker', 'Evaluator', 'Executive Sponsor', 'Influencer', 'Technical Buyer', 'Other']
      - name: is_primary
        description: "Indica se é o contato primário da Opportunity — é dele que o Salesforce preenche o ContactId (primary_contact_id em stg_opportunities)."
        data_tests:
          - not_null
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  
  - name: stg_marketing_campaigns
    description: "Campanhas de marketing (fonte sintética de tracking de primeira parte). A combinação (utm_source, utm_medium, utm_campaign) é única por campanha — é a chave do stitching marketing ↔ Lead (2b), garantida pelo teste singular assert_marketing_campaigns_utm_unique."
    columns:
      - name: campaign_id
        description: "ID da campanha (UUID gerado na fonte). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: utm_source
        description: "Origem do tráfego (plataforma). 'newsletter' é canal próprio, com custo zero."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['google', 'meta', 'linkedin', 'newsletter']
      - name: utm_medium
        description: "Mídia do tráfego (tipo de canal)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cpc', 'paid_social', 'email']
      - name: utm_campaign
        description: "Nome da campanha no padrão UTM (snake_case)."
        data_tests:
          - not_null
      - name: start_date
        description: "Início da veiculação da campanha. Campanhas se sobrepõem no tempo, o que permite jornadas com várias campanhas."
        data_tests:
          - not_null
      - name: end_date
        description: "Fim da veiculação da campanha (inclusivo)."
        data_tests:
          - not_null
  - name: stg_marketing_click_events
    description: "Cliques individuais em anúncios com UTM (tracking de primeira parte, tipo GA4). Cada clique pertence a um visitante anônimo (visitor_id); a jornada de um visitante pode cruzar várias campanhas. O click_id nunca chega ao Salesforce: o vínculo com o Lead é via stg_marketing_form_submissions (visitor_id → e-mail). Materializado como incremental (merge por click_id, reprocessa os últimos click_events_lookback_days dias para eventos atrasados): é a única fonte append-only com volume crescente. O int_marketing_touches continua view porque uma conversão nova reclassifica cliques antigos."
    columns:
      - name: click_id
        description: "ID do clique (UUID gerado na fonte). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: visitor_id
        description: "ID anônimo do visitante (cookie, equivalente ao user_pseudo_id do GA4). Agrupa cliques numa jornada. Sujeira proposital: em ~10% das jornadas os primeiros cliques ficam em outro visitor_id (troca de dispositivo), que nunca envia formulário — esses toques não são recuperáveis."
        data_tests:
          - not_null
      - name: campaign_id
        description: "ID da campanha do clique (FK para stg_marketing_campaigns)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_marketing_campaigns')
                field: campaign_id
      - name: utm_source
        description: "Origem do tráfego do clique (redundante com a campanha, mantido como veio no evento)."
      - name: utm_medium
        description: "Mídia do tráfego do clique."
      - name: utm_campaign
        description: "Nome da campanha do clique."
      - name: clicked_at
        description: "Data/hora do clique. TIMESTAMP_NTZ (sem fuso) na fonte, mas gerado em UTC — ao comparar com created_at do Lead ou submitted_at (TIMESTAMP_TZ) na 2b, converter para o mesmo referencial."
        data_tests:
          - not_null
  - name: stg_marketing_form_submissions
    description: "Envios de formulário (evento de conversão do tracking). Liga a jornada (visitor_id) ao Lead do CRM pelo e-mail. Inclui envios sem Lead correspondente (~5%: spam ou falha na integração com o CRM) e reenvios de Leads já existentes (re-engajamento: ~20% dos Leads de jornada voltam e enviam de novo, até 2 vezes)."
    columns:
      - name: submission_id
        description: "ID do envio (UUID gerado na fonte). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: visitor_id
        description: "Visitante que enviou o formulário (FK lógica para stg_marketing_click_events.visitor_id)."
        data_tests:
          - not_null
      - name: email
        description: "E-mail normalizado (lower + trim). Chave do stitching com stg_leads."
        data_tests:
          - not_null
      - name: email_raw
        description: "E-mail como digitado no formulário. Sujeira proposital: ~10% com caixa ou espaço diferente do CRM — mantido para auditoria."
      - name: submitted_at
        description: "Data/hora do envio. TIMESTAMP_NTZ gerado em UTC. É a âncora de tempo da conversão: o created_at do Lead reflete a carga no CRM (todos em 21/set/2026), não o momento da conversão."
        data_tests:
          - not_null

  - name: stg_marketing_campaign_daily_stats
    description: "Desempenho por campanha e dia (impressões, cliques, custo), como a API de uma plataforma de anúncio entregaria. Grão único (campaign_id, stat_date), garantido pelo teste singular assert_marketing_daily_stats_grain_unique. Base do custo no CPL/ROAS (2c)."
    columns:
      - name: campaign_id
        description: "ID da campanha (FK para stg_marketing_campaigns)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_marketing_campaigns')
                field: campaign_id
      - name: stat_date
        description: "Dia de veiculação."
        data_tests:
          - not_null
      - name: impressions
        description: "Impressões no dia."
        data_tests:
          - not_null
      - name: clicks
        description: "Cliques contados pela plataforma no dia. Propositalmente 10–25% acima dos cliques rastreados no site (stg_marketing_click_events): ad blocker e bounce antes da tag disparar. É uma discrepância real entre fontes."
        data_tests:
          - not_null
      - name: cost
        description: "Custo do dia (number(10, 2)). Zero na campanha de newsletter (canal próprio): o ROAS/CPL precisa tratar divisão por zero."
        data_tests:
          - not_null