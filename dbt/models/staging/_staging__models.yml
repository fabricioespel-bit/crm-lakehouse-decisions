version: 2

models:
  - name: stg_accounts
    description: "Accounts ativas do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: account_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_name
        description: "Nome da Account. Contém duplicatas propositais (variações de maiúsculas, sufixo 'Ltda', espaço extra) — resolvidas em int_accounts via int_account_id_mapping."
        data_tests:
          - not_null
      - name: industry
        description: "Setor padronizado via seed industry_mapping (ex.: 'Tech' → 'Technology'). Valores fora do mapeamento passam com o valor original e são acusados pelo teste accepted_values."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: industry_raw
        description: "Valor original do picklist Industry no Salesforce, sem padronização (mantido para auditoria)."
      - name: billing_city
        description: "Cidade de cobrança."
      - name: billing_state_code
        description: "UF de cobrança (código ISO)."
      - name: billing_country_code
        description: "País de cobrança (código ISO)."
      - name: phone
        description: "Telefone principal."
      - name: website
        description: "Site da empresa."
      - name: number_of_employees
        description: "Número de funcionários."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_contacts
    description: "Contatos ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: contact_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: account_id
        description: "ID da Account à qual o contato pertence (FK para stg_accounts). Pode apontar para uma Account duplicada — a reatribuição para a mestre é feita na intermediate via int_account_id_mapping."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: full_name
        description: "Nome completo do contato, calculado pelo Salesforce (FirstName + LastName)."
        data_tests:
          - not_null
      - name: first_name
        description: "Primeiro nome do contato."
      - name: last_name
        description: "Último nome do contato."
      - name: email
        description: "E-mail do contato."
        data_tests:
          - not_null
      - name: phone
        description: "Telefone do contato."
      - name: title
        description: "Cargo do contato."
      - name: created_at
        description: "Data/hora de criação do registro no Salesforce."
      - name: updated_at
        description: "Última modificação do registro (SystemModstamp)."
  - name: stg_leads
    description: "Leads ativos do Salesforce (sem registros deletados), com tipagem e nomes padronizados."
    columns:
      - name: lead_id
        description: "ID do Salesforce (18 caracteres). Chave primária."
        data_tests:
          - unique
          - not_null
      - name: last_name
        description: "Sobrenome do lead."
        data_tests:
          - not_null
      - name: company
        description: "Empresa do lead."
        data_tests:
          - not_null
      - name: status
        description: "Status do lead."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Open - Not Contacted', 'Working - Contacted', 'Closed - Converted', 'Closed - Not Converted']
      - name: lead_source
        description: "Fonte do lead."
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['Web', 'Phone Inquiry', 'Partner Referral', 'Employee Referral', 'Trade Show']
              config:
                severity: warn
      - name: industry
        description: ""
        data_tests:
          - accepted_values:
              arguments:
                values: ['Education', 'Healthcare', 'Technology', 'Retail', 'Financial Services', 'Manufacturing']
      - name: is_converted
        description: "Indica se o lead foi convertido."
        data_tests:
          - not_null
      - name: utm_source
        description: "Origem de trafego do lead"
      - name: utm_medium
        description: "Midia de trafego do lead"
      - name: utm_campaign
        description: "Campanha de trafego do lead"
      - name: converted_date
        description: "Data de conversão do lead"
      - name: converted_account_id
        description: "ID da Account convertida"
      - name: converted_contact_id
        description: "ID do Contato convertido"
      - name: converted_opportunity_id
        description: "ID da Oportunidade convertida"
      - name: created_at
        description: "Data de criação do lead"
      - name: updated_at
        description: "Data de atualização do lead"