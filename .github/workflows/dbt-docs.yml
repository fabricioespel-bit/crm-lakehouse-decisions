name: site

# site do portfólio: página na raiz, dbt docs em /docs/ e os números do painel em /data/ (exportados
# dos marts a cada deploy). O full-refresh semanal reconstrói os marts, então redeploya depois dele.
on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "portfolio/**"
      - "scripts/export_dashboard_data.py"
      - ".github/workflows/dbt-docs.yml"
  workflow_run:
    workflows: ["dbt full-refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# não cancela um deploy em andamento: o próximo espera
concurrency:
  group: dbt-docs
  cancel-in-progress: false

jobs:
  build-site:
    # depois do full-refresh, só publica se ele terminou verde
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/ci
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dbt
        run: pip install dbt-core==1.12.5 dbt-snowflake==1.12.1

      # target docs: lê o catálogo dos schemas de verdade, só leitura
      - name: Gera o site de docs
        run: dbt docs generate --target docs --static

      # mesma credencial só leitura: o painel lê os marts e o int_lead_attribution
      - name: Exporta os dados do painel
        working-directory: .
        run: python scripts/export_dashboard_data.py --out site/data/dashboard.json

      - name: Monta o site
        run: |
          mkdir -p ../site/docs
          cp target/static_index.html ../site/docs/index.html
          cp ../portfolio/index.html ../site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4